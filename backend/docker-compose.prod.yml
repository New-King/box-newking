# 镜像由 Docker Hub 提供；服务器只 pull + 启动，不在服务器上 build
services:
  box-newking:
    image: ${BOX_NEWKING_IMAGE:?请设置 BOX_NEWKING_IMAGE，例如 你的用户名/box-newking:dev}
    container_name: box-newking
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - box-newking-data:/app/data:rw
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

volumes:
  box-newking-data:
