# 快速部署：前端 themes 从宿主机挂载，容器只跑后端 Python
services:
  box-newking:
    build:
      context: .
      dockerfile: Dockerfile.fast
      args:
        APP_VERSION: "2.5.4-dev"
        VCS_REF: "fast-deploy"
    image: box-newking:fast
    container_name: box-newking
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - box-newking-data:/app/data:rw
      # 前端静态文件走磁盘（rsync 更新后即时生效，无需打进镜像）
      - /opt/server/box-newking/backend/themes:/app/themes:ro
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

volumes:
  box-newking-data:
